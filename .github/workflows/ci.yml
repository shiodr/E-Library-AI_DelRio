name: Phase 1 checks
on: [push, pull_request]
jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: elibrary
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: elibrary_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U elibrary -d elibrary_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+pg8000://elibrary:test-only-password@127.0.0.1:5432/elibrary_test
      TEST_DATABASE_URL: postgresql+pg8000://elibrary:test-only-password@127.0.0.1:5432/elibrary_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/constraints.txt
      - run: npm ci
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: backend
      - run: npm test
      - run: npm run build
